# nginx site config для saas-crm.
#
# Установка:
#   sudo cp scripts/nginx-saas-crm.conf /etc/nginx/sites-available/saas-crm
#   sudo ln -s /etc/nginx/sites-available/saas-crm /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS:
#   sudo certbot --nginx -d detailprocrm.ru -d www.detailprocrm.ru
#   (certbot автоматически добавит ssl_certificate / ssl_certificate_key
#    и редирект 80→443; нижеперечисленные блоки уже под HTTPS-вариант.)

# ── 1. HTTP → HTTPS redirect ────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name detailprocrm.ru www.detailprocrm.ru;

    # Let's Encrypt ACME challenge должен отвечать по HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 2. HTTPS — основной server block ────────────────────────────────────
server {
    # http2 on; — синтаксис nginx ≥1.25.
    # На Ubuntu 24.04 (nginx 1.24) пишем http2 в самой listen-директиве:
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name detailprocrm.ru www.detailprocrm.ru;

    # certbot подставит:
    # ssl_certificate     /etc/letsencrypt/live/detailprocrm.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/detailprocrm.ru/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Логи отдельным файлом
    access_log /var/log/nginx/saas-crm.access.log;
    error_log  /var/log/nginx/saas-crm.error.log;

    # Лимит на тело — клиентские аватары до ~2 MB (server/app.cjs: limit '2mb')
    client_max_body_size 2m;

    # Базовые security headers (приложение тоже их шлёт, дублируем на уровне nginx)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS включаем только когда уверены, что HTTPS не отключим:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # gzip — статика выигрывает заметно
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Webhooks: НЕ буферизуем тело, чтобы HMAC-подпись считалась корректно
    # express.raw читает сырой стрим — если nginx будет передавать с задержкой,
    # это не страшно, но request_buffering off уменьшает latency.
    location /api/webhooks/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        # Продамус ретраит, если не получил 200 — даём приложению время
        proxy_read_timeout 30s;
    }

    # ── API ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Статика Vite-build (прямо с диска, минуя Node) ────────────────
    # Хеши в именах → можно кешировать «навсегда»
    location /assets/ {
        root /var/www/saas-crm/client/dist;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # favicon, robots и пр. — короткий кеш
    location ~* ^/(favicon\.ico|robots\.txt|.*\.png|.*\.svg|.*\.webmanifest)$ {
        root /var/www/saas-crm/client/dist;
        try_files $uri @app;
        expires 7d;
        access_log off;
    }

    # ── SPA fallback: всё, что не /api и не статика — отдаёт Node (sendFile index.html) ──
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @app {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

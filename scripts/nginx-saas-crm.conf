# nginx site config для saas-crm.
#
# Установка:
#   sudo cp scripts/nginx-saas-crm.conf /etc/nginx/sites-available/saas-crm
#   sudo ln -s /etc/nginx/sites-available/saas-crm /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS:
#   sudo certbot --nginx -d detailprocrm.ru -d www.detailprocrm.ru
#   (certbot автоматически добавит ssl_certificate / ssl_certificate_key
#    и редирект 80→443; нижеперечисленные блоки уже под HTTPS-вариант.)

# ── Rate-limit zone (front-line анти-flood) ──────────────────────────────
# 10MB shared-memory hash → ~160 000 уникальных IP под учётом.
# 30 req/sec — потолок здорового пика. Burst=60 — короткий всплеск
# разрешён без 503 (например первая загрузка SPA: HTML + 5-10 chunks +
# /api/profile одновременно).
# Применяется только на /api/* в server-блоке ниже. Webhooks (Prodamus)
# имеют свой более мягкий лимит, чтобы Prodamus не ловил 503 на
# legitimate ретраях.
#
# Эта строка должна быть на уровне http (вне server) — обычно nginx.conf
# уже включает sites-enabled/* как раз внутри http, поэтому здесь работает.
# Если у вас site-config где-то ещё — переедет в общий conf.d/.
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=webhook_rl:5m rate=10r/s;
limit_req_status 429;

# ── 1. HTTP → HTTPS redirect ────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name detailprocrm.ru www.detailprocrm.ru;

    # Let's Encrypt ACME challenge должен отвечать по HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 2. HTTPS — основной server block ────────────────────────────────────
server {
    # http2 on; — синтаксис nginx ≥1.25.
    # На Ubuntu 24.04 (nginx 1.24) пишем http2 в самой listen-директиве:
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name detailprocrm.ru www.detailprocrm.ru;

    # SSL (выпущен certbot-ом, см. README — `sudo certbot --nginx -d detailprocrm.ru`).
    # Эти пути ОБЯЗАТЕЛЬНЫ при `cp` этого конфига в /etc/nginx/sites-available/,
    # иначе `nginx -t` упадёт с «no ssl_certificate is defined». Если когда-то
    # потребуется выпустить заново — certbot пересоздаст файлы, пути не изменятся.
    ssl_certificate     /etc/letsencrypt/live/detailprocrm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/detailprocrm.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Логи отдельным файлом
    access_log /var/log/nginx/saas-crm.access.log;
    error_log  /var/log/nginx/saas-crm.error.log;

    # Лимит на тело: аватары пользователей до 5 MB (multer в server/routes/profile.cjs).
    # JSON-payload-и приложения сильно меньше — общего лимита 5m хватает.
    client_max_body_size 5m;

    # Базовые security headers (приложение тоже их шлёт через CSP+HSTS,
    # дублируем на уровне nginx — defense-in-depth, если Node-процесс
    # упал и nginx отдаёт 502, заголовки всё равно стоят).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: 2 года + includeSubDomains. Включаем после стабилизации HTTPS
    # — после первого подгруза браузер закеширует на max-age, обратной
    # дороги нет (без preload-снятия). У нас HTTPS работает с 2025-го,
    # certbot auto-renew настроен → безопасно включить.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # gzip — статика выигрывает заметно
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Webhooks: НЕ буферизуем тело, чтобы HMAC-подпись считалась корректно
    # express.raw читает сырой стрим — если nginx будет передавать с задержкой,
    # это не страшно, но request_buffering off уменьшает latency.
    # Rate-limit мягкий (10/sec, burst=20): Prodamus может прислать ретрай
    # серию, но не должно быть тысячи запросов в секунду от одного источника.
    location /api/webhooks/ {
        limit_req zone=webhook_rl burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        # Продамус ретраит, если не получил 200 — даём приложению время
        proxy_read_timeout 30s;
    }

    # ── API ───────────────────────────────────────────────────────────
    # Rate-limit: 30 req/sec на IP с burst=60. Для активного юзера CRM
    # это много — норма ~5-10 req/sec при открытии экрана. Защищает от
    # одиночного источника-флудера. Distributed-флуд (через ботсеть)
    # требует Cloudflare; здесь только защита от одиночного IP.
    location /api/ {
        limit_req zone=api_rl burst=60 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Статика Vite-build (прямо с диска, минуя Node) ────────────────
    # Хеши в именах → можно кешировать «навсегда»
    location /assets/ {
        root /var/www/saas-crm/client/dist;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Аватары пользователей (загружаются через /api/profile/avatar) ─
    # Файлы кладёт sharp в /var/www/saas-crm/var/avatars/<user_id>.webp.
    # nginx отдаёт напрямую, не дёргая Node.
    location /avatars/ {
        alias /var/www/saas-crm/var/avatars/;
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    # favicon, robots и пр. — короткий кеш
    location ~* ^/(favicon\.ico|robots\.txt|.*\.png|.*\.svg|.*\.webmanifest)$ {
        root /var/www/saas-crm/client/dist;
        try_files $uri @app;
        expires 7d;
        access_log off;
    }

    # ── SPA fallback: всё, что не /api и не статика — отдаёт Node (sendFile index.html) ──
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @app {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon: «DC» — чёрная D + оранжевая C, плоская версия по присланному
  лого. Углы скошены лесенкой, чтобы сохранить «инженерный» характер
  оригинала, но без 3D-светотени (на 16×16 рх любые детали всё равно
  теряются). Фон прозрачный — корректно ложится на любую тему вкладки.

  Если нужен точный матч с фирменным 3D-лого — заменить этот файл на
  экспорт из дизайнерского исходника (SVG ≥ 64×64 или PNG 64×64+).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- D: чёрная блочная литера. Внешний контур + внутренняя «дырка». -->
  <path
    d="M 6 8 L 28 8 L 32 12 L 32 52 L 28 56 L 6 56 Z M 14 16 L 14 48 L 24 48 L 24 16 Z"
    fill="#18181b"
    fill-rule="evenodd"
  />
  <!-- C: оранжевая блочная литера. C-форма из прямых углов. -->
  <path
    d="M 36 8 L 58 8 L 58 18 L 46 18 L 46 46 L 58 46 L 58 56 L 36 56 L 32 52 L 32 12 Z"
    fill="#f97316"
  />
</svg>
